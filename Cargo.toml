[package]
name = "hermes-pubky-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Native Pubky bindings for the Hermes `pubky` memory provider"
repository = "https://github.com/MCarlomagno/hermes-pubky"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py311"] }
pubky = { git = "https://github.com/pubky/pubky-core", rev = "6a14bdb8fa2e30ef4e4b241fcdd3992c453d2378", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
futures-util = { version = "0.3", default-features = false }
sha2 = "0.10"
hex = "0.4"

[features]
# maturin enables this; plain `cargo test` must NOT, or the test binary
# fails to link against libpython.
extension-module = ["pyo3/extension-module"]

# A live testnet with a pre-authorized grant, for validating the Hermes flows.
[[example]]
name = "testnet_fixture"
path = "examples/testnet_fixture.rs"

# The Rust e2e suite lives outside `tests/`, which holds the Python suite.
[[test]]
name = "e2e"
path = "e2e/e2e.rs"

[dev-dependencies]
pubky-testnet = { git = "https://github.com/pubky/pubky-core", rev = "6a14bdb8fa2e30ef4e4b241fcdd3992c453d2378" }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
