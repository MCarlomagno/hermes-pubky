name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  HERMES_VERSION: "0.19.0"

jobs:
  rust:
    name: Rust (fmt, clippy, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib

  e2e:
    name: Rust e2e (Pubky v0.11 testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The homeserver under test needs a real Postgres; this mirrors the
      # connection string pubky-core's own CI uses.
      TEST_PUBKY_CONNECTION_STRING: postgres://test_user:test_pass@localhost:5432/postgres?pubky-test=true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Storage protocol against a live testnet
        # Single-threaded: the static testnet binds fixed, well-known ports.
        run: cargo test --test v2 -- --ignored --test-threads=1 --nocapture

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install the wheel
        # Installing the built wheel means the tests exercise the shipped
        # artifact, not the source tree.
        run: |
          uv pip install --system maturin pytest
          maturin build --release --out dist
          uv pip install --system --no-index --find-links dist hermes-pubky
      - run: python scripts/smoke_test.py
      - run: pytest -q

  hermes:
    name: Managed Hermes integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the pinned Hermes beside the package
        run: |
          uv pip install --system maturin pytest "hermes-agent==${HERMES_VERSION}"
          maturin build --release --out dist
          uv pip install --system --no-index --find-links dist hermes-pubky
      - name: Upstream contract and conversation fixtures
        run: pytest tests/test_hermes_contract.py tests/test_database.py -q
      - name: Launch a real managed Hermes turn
        run: python scripts/check_managed_hermes_integration.py

  handoff:
    name: A-to-B handoff (Hermes + Pubky testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_PUBKY_CONNECTION_STRING: postgres://test_user:test_pass@localhost:5432/postgres?pubky-test=true
      HERMES_PUBKY_TESTNET: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install everything the acceptance test needs
        run: |
          uv pip install --system maturin "hermes-agent==${HERMES_VERSION}"
          maturin build --release --out dist
          uv pip install --system --no-index --find-links dist hermes-pubky
      - name: Start a testnet with pre-authorized grants
        run: |
          cargo run --release --example testnet_fixture > /tmp/fixture.json 2> /tmp/fixture.err &
          for _ in $(seq 1 180); do
            grep -q READY /tmp/fixture.json && break
            sleep 1
          done
          grep -q READY /tmp/fixture.json || { cat /tmp/fixture.err; exit 1; }
      - name: Recover an agent on a second machine
        run: python scripts/check_managed_handoff.py --fixture /tmp/fixture.json
