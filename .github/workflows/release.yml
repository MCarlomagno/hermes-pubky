name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS gets a single universal2 wheel rather than one per architecture.
  # GitHub retired the last x86_64 macOS image (macos-13), so Intel wheels can
  # only be produced by cross-compiling from an arm64 runner — and a universal2
  # build is the version of that we can actually execute here, since the arm64
  # runner loads its own slice during the smoke test.
  wheels-macos:
    name: Wheel (macos-universal2)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal2 wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --target universal2-apple-darwin --out dist
      - name: Verify both architectures are present
        run: |
          python -m zipfile -e dist/*.whl /tmp/whl
          lipo -archs /tmp/whl/hermes_pubky/_native.abi3.so | tee /tmp/archs
          grep -q x86_64 /tmp/archs && grep -q arm64 /tmp/archs
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          python scripts/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-universal2
          path: dist/*.whl

  wheels-linux:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: manylinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --compatibility manylinux2014
          manylinux: auto
          sccache: "true"
      - name: Smoke-test the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python scripts/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels-macos, wheels-linux, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-pubky
    permissions:
      # Trusted publishing — no API token is stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: List artifacts
        run: ls -la dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: GitHub release
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
